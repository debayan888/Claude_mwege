<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Choo Lo</title>
<style>
  @font-face { font-family: 'Serif'; font-style: italic; src: url(fonts/InstrumentSerif-400-italic-latin.woff2); }
  @font-face { font-family: 'Inter'; src: url(fonts/Inter-400-latin.woff2); }
  @font-face { font-family: 'Pop'; font-weight: 800; src: url(fonts/Poppins-800-latin.woff2); }
  @font-face { font-family: 'Pop'; font-weight: 300; src: url(fonts/Poppins-300-latin.woff2); }
  @font-face { font-family: 'Script'; font-weight: 700; src: url(fonts/DancingScript-700-latin.woff2); }
  @font-face { font-family: 'Neon'; src: url(fonts/Monoton-400-latin.woff2); }
  html, body { margin: 0; background: #000; }
  canvas { display: block; }
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
// "Choo Lo" lyric video. Ten scenes, each with its own world, joined by
// cinematic transitions. Every frame depends only on the time t.
const W = 1920, H = 1080;
const main = document.getElementById('c').getContext('2d');
let AUDIO = null, LYRICS = [];

// ---------- helpers ----------
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const lerp = (a, b, p) => a + (b - a) * p;
const smooth = (a, b, x) => { const p = clamp((x - a) / (b - a)); return p * p * (3 - 2 * p); };
const ease = (p) => 1 - Math.pow(1 - clamp(p), 3);
const easeBack = (p) => { p = clamp(p); const c = 1.9; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
function rng(seed) { let s = seed >>> 0; return () => ((s = (s * 1664525 + 1013904223) >>> 0) / 4294967296); }
const hash = (n) => { const x = Math.sin(n * 127.1) * 43758.5453; return x - Math.floor(x); };
const wrap = (v, m) => ((v % m) + m) % m;
function buffer() { const c = document.createElement('canvas'); c.width = W; c.height = H; return c; }
function grad(g, y0, y1, stops) { const gr = g.createLinearGradient(0, y0, 0, y1); stops.forEach(([o, c]) => gr.addColorStop(o, c)); return gr; }

function audioAt(arr, t) { if (!AUDIO) return 0; const f = t * AUDIO.fps, i = Math.floor(f), p = f - i; return lerp(arr[i] ?? 0, arr[i + 1] ?? 0, p); }
function energy(t) { let s = 0; for (let k = 0; k < 12; k++) s += audioAt(AUDIO ? AUDIO.full : [], t - k / 30); return s / 12; }
function bass(t) { let m = 0; for (let k = 0; k < 4; k++) m = Math.max(m, audioAt(AUDIO ? AUDIO.bass : [], t - k / 30) * (1 - k * 0.18)); return m; }
// a "hit" is a bass peak well above the recent average: used for flashes and bursts
function hit(t) { const now = bass(t); let avg = 0; for (let k = 4; k < 40; k++) avg += audioAt(AUDIO ? AUDIO.bass : [], t - k / 30); avg /= 36; return clamp((now - avg - 0.12) * 3); }

// ---------- sprites ----------
function sprite(size, stops) {
  const c = document.createElement('canvas'); c.width = c.height = size;
  const g = c.getContext('2d'), r = size / 2, gr = g.createRadialGradient(r, r, 0, r, r, r);
  stops.forEach(([o, col]) => gr.addColorStop(o, col)); g.fillStyle = gr; g.fillRect(0, 0, size, size); return c;
}
const glow = (r, g, b, core = 0.9) => sprite(256, [[0, `rgba(${r},${g},${b},${core})`], [0.3, `rgba(${r},${g},${b},${core * 0.35})`], [1, `rgba(${r},${g},${b},0)`]]);
const G_PINK = glow(255, 120, 170), G_GOLD = glow(255, 200, 120), G_WHITE = glow(255, 250, 245, 1),
  G_TEAL = glow(90, 220, 230), G_AMBER = glow(255, 160, 60), G_BLUE = glow(120, 160, 255), G_VIOLET = glow(170, 110, 255);
const GRAIN = (() => {
  const c = document.createElement('canvas'); c.width = c.height = 512;
  const g = c.getContext('2d'), d = g.createImageData(512, 512), r = rng(7);
  for (let i = 0; i < d.data.length; i += 4) { const v = r() * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 16; }
  g.putImageData(d, 0, 0); return c;
})();
function add(g, spr, x, y, r, a) { if (a <= 0) return; g.globalAlpha = a; g.drawImage(spr, x - r, y - r, r * 2, r * 2); }
function lighter(g, fn) { g.save(); g.globalCompositeOperation = 'lighter'; fn(); g.restore(); }

// shared skyline (used in two scenes)
function skyline(seed, base, color, windows) {
  const c = document.createElement('canvas'); c.width = W; c.height = 420;
  const g = c.getContext('2d'), r = rng(seed);
  for (let x = -20; x < W;) {
    const w = 50 + r() * 120, h = base * (0.35 + r() * 0.65);
    g.fillStyle = color; g.fillRect(x, 420 - h, w, h);
    if (r() < 0.25) g.fillRect(x + w * 0.45, 420 - h - 30, 4, 30);
    if (windows) for (let wy = 420 - h + 12; wy < 410; wy += 20) for (let wx = x + 8; wx < x + w - 10; wx += 16)
      if (r() < 0.2) { g.fillStyle = `rgba(255,${190 + r() * 50 | 0},${110 + r() * 70 | 0},${0.3 + r() * 0.6})`; g.fillRect(wx, wy, 6, 9); g.fillStyle = color; }
    x += w + 2;
  }
  return c;
}
const CITY_FAR = skyline(11, 260, 'rgba(40,20,70,0.85)', false);
const CITY_NEAR = skyline(42, 330, '#0b0614', true);

// =====================================================================
// SCENES. Each draws a full frame on g. lt = seconds since scene start.
// =====================================================================

// 1. TITLE: a dark room of light. Letters bloom out of blur, a flare sweeps.
function sTitle(g, t, lt, e, b) {
  g.fillStyle = grad(g, 0, H, [[0, '#07030f'], [0.6, '#1a0826'], [1, '#2b0b2e']]); g.fillRect(0, 0, W, H);
  lighter(g, () => {
    add(g, G_VIOLET, W * 0.3 + Math.sin(lt * 0.3) * 200, H * 0.4, 900, 0.35);
    add(g, G_PINK, W * 0.75 + Math.cos(lt * 0.25) * 160, H * 0.65, 800, 0.3);
    const r = rng(3);
    for (let i = 0; i < 70; i++) { const x = r() * W, y = wrap(r() * H - lt * (10 + r() * 30), H), s = 2 + r() * 5; add(g, G_GOLD, x, y, s * 4, 0.5 * (0.5 + 0.5 * Math.sin(lt * 2 + i))); }
  });
  const word = 'Choo Lo';
  g.save(); g.font = '700 230px Script'; g.textAlign = 'left'; g.textBaseline = 'middle';
  const total = g.measureText(word).width; let x = W / 2 - total / 2;
  [...word].forEach((ch, i) => {
    const p = ease((lt - 1.2 - i * 0.16) / 1.1), w = g.measureText(ch).width;
    if (p > 0) {
      g.globalAlpha = p; g.filter = `blur(${(1 - p) * 18}px)`;
      g.shadowColor = 'rgba(255,90,160,0.9)'; g.shadowBlur = 40;
      g.fillStyle = grad(g, H / 2 - 120, H / 2 + 80, [[0, '#fff1f6'], [0.6, '#ffb3cf'], [1, '#ff7aa8']]);
      g.fillText(ch, x, H / 2 - 40 + (1 - p) * 40);
    }
    x += w;
  });
  g.filter = 'none'; g.shadowBlur = 0;
  const a = ease((lt - 3.4) / 1.4) * (1 - smooth(11.5, 13.5, lt));
  g.globalAlpha = a; g.font = '300 34px Pop'; g.textAlign = 'center'; g.letterSpacing = '22px'; g.fillStyle = '#ffd9e6';
  g.fillText('THE LOCAL TRAIN', W / 2 + 11, H / 2 + 130);
  g.letterSpacing = '0px'; g.globalAlpha = a * 0.6; g.fillStyle = '#ffd9e6';
  const lw = 300 * ease((lt - 3.6) / 1.5); g.fillRect(W / 2 - lw, H / 2 + 180, lw * 2, 1.5);
  g.restore();
  // the anamorphic flare that sweeps across as the title lands
  const fp = (lt - 2.0) / 2.2;
  if (fp > 0 && fp < 1) lighter(g, () => {
    const fx = lerp(-200, W + 200, ease(fp)), fa = Math.sin(fp * Math.PI);
    g.globalAlpha = fa * 0.9; g.drawImage(G_WHITE, fx - 900, H / 2 - 50, 1800, 20);
    g.globalAlpha = fa * 0.5; g.drawImage(G_PINK, fx - 260, H / 2 - 300, 520, 520);
  });
}

// 2. TRAIN WINDOW IN THE RAIN: city lights stream past behind wet glass.
const DROPS = (() => { const r = rng(21); return Array.from({ length: 160 }, () => ({ x: r() * W, y: r() * H, s: 3 + r() * r() * 14, sp: r() < 0.25 ? 40 + r() * 120 : 0, ph: r() * 50 })); })();
function sWindow(g, t, lt, e, b) {
  g.fillStyle = grad(g, 0, H, [[0, '#050a18'], [0.55, '#0c1630'], [1, '#1a1030']]); g.fillRect(0, 0, W, H);
  lighter(g, () => {
    const r = rng(5);
    for (let i = 0; i < 60; i++) { const sp = 60 + r() * 60, x = wrap(r() * (W + 400) - lt * sp, W + 400) - 200, y = H * (0.35 + r() * 0.35);
      add(g, r() < 0.5 ? G_AMBER : G_TEAL, x, y, 40 + r() * 70, 0.35 + e * 0.3); }
    for (let i = 0; i < 26; i++) { const sp = 500 + r() * 400, x = wrap(r() * (W + 800) - lt * sp, W + 800) - 400, y = H * (0.2 + r() * 0.7);
      g.globalAlpha = 0.25; g.drawImage(r() < 0.5 ? G_PINK : G_GOLD, x - 260, y - 50, 520, 100); }
  });
  g.fillStyle = 'rgba(2,3,8,0.85)';
  for (let i = 0; i < 3; i++) { const x = wrap(i * 800 - lt * 1400, W + 1200) - 300; g.fillRect(x, 0, 26, H); }
  for (const d of DROPS) {
    const y = d.sp ? wrap(d.y + (lt + d.ph) * d.sp, H + 40) - 20 : d.y;
    if (d.sp) { g.strokeStyle = 'rgba(200,220,255,0.12)'; g.lineWidth = d.s * 0.5; g.beginPath(); g.moveTo(d.x, y - 80); g.lineTo(d.x, y); g.stroke(); }
    g.fillStyle = 'rgba(180,200,255,0.10)'; g.beginPath(); g.ellipse(d.x, y, d.s * 0.8, d.s, 0, 0, 7); g.fill();
    g.fillStyle = 'rgba(255,255,255,0.55)'; g.beginPath(); g.arc(d.x - d.s * 0.25, y - d.s * 0.35, d.s * 0.22, 0, 7); g.fill();
  }
  g.fillStyle = '#05040a';
  g.fillRect(0, 0, W, 70); g.fillRect(0, H - 110, W, 110); g.fillRect(0, 0, 90, H); g.fillRect(W - 90, 0, 90, H);
  g.strokeStyle = 'rgba(255,200,150,0.18)'; g.lineWidth = 3; g.beginPath(); g.roundRect(90, 70, W - 180, H - 180, 40); g.stroke();
  actWindow(g, t, lt);
}

// 3. EMPTY PLATFORM AT NIGHT: lamps, rain in the light, a wet floor.
function sPlatform(g, t, lt, e, b) {
  g.fillStyle = grad(g, 0, H, [[0, '#04060f'], [0.5, '#0d1328'], [0.62, '#181a33'], [1, '#07070d']]); g.fillRect(0, 0, W, H);
  const hy = H * 0.58, vx = W * 0.5 + Math.sin(lt * 0.1) * 40;
  g.fillStyle = grad(g, hy, H, [[0, '#14142a'], [1, '#030308']]);
  g.beginPath(); g.moveTo(vx - 40, hy); g.lineTo(vx + 40, hy); g.lineTo(W + 600, H); g.lineTo(-600, H); g.fill();
  g.strokeStyle = 'rgba(255,210,90,0.55)'; g.lineWidth = 6; g.setLineDash([60, 40]); g.lineDashOffset = -lt * 120;
  g.beginPath(); g.moveTo(vx + 30, hy); g.lineTo(W + 300, H); g.stroke(); g.setLineDash([]);
  for (let i = 5; i >= 0; i--) {
    const z = wrap(i - lt * 0.12, 6), s = 1 / (0.5 + z), x = vx - 60 - 900 * s, y = hy - 560 * s, base = hy + 520 * s * 0.55;
    g.fillStyle = '#05050a'; g.fillRect(x - 6 * s, y, 12 * s, base - y);
    lighter(g, () => {
      const cone = g.createLinearGradient(0, y, 0, base);
      cone.addColorStop(0, 'rgba(255,190,110,0.35)'); cone.addColorStop(1, 'rgba(255,190,110,0)');
      g.fillStyle = cone; g.beginPath(); g.moveTo(x + 10 * s, y + 10 * s); g.lineTo(x + 250 * s, base); g.lineTo(x - 230 * s, base); g.fill();
      add(g, G_AMBER, x + 10 * s, y + 6 * s, 160 * s, 0.9);
      add(g, G_WHITE, x + 10 * s, y + 6 * s, 30 * s, 1);
      add(g, G_AMBER, x + 10 * s, base + 40 * s, 200 * s, 0.25);
    });
  }
  const r = rng(13);
  g.strokeStyle = 'rgba(190,210,255,0.35)'; g.lineWidth = 1.5; g.beginPath();
  for (let i = 0; i < 380; i++) { const x = r() * W, y = wrap(r() * H + lt * (900 + r() * 500), H + 60) - 60; g.moveTo(x, y); g.lineTo(x - 6, y + 34); }
  g.stroke();
  for (let i = 0; i < 14; i++) { const k = Math.floor(lt * 1.6 + i / 14 * 1.6), p = wrap(lt * 1.6 + i / 14 * 1.6, 1);
    const x = hash(k * 31 + i) * W, y = hy + 60 + hash(k * 17 + i) * (H - hy - 60);
    g.strokeStyle = `rgba(200,210,255,${0.35 * (1 - p)})`; g.lineWidth = 1.5; g.beginPath(); g.ellipse(x, y, 10 + p * 70, (10 + p * 70) * 0.25, 0, 0, 7); g.stroke(); }
  actPlatform(g, t, lt);
}

// heart-shaped bursts that fire on strong bass hits
function heartXY(a) { return [16 * Math.pow(Math.sin(a), 3), -(13 * Math.cos(a) - 5 * Math.cos(2 * a) - 2 * Math.cos(3 * a) - Math.cos(4 * a))]; }
const HITS = [];
function burst(g, t, from, to) {
  for (const ht of HITS) {
    if (ht < from || ht > to) continue; const age = t - ht; if (age < 0 || age > 1.6) continue;
    const cx = W * (0.15 + hash(ht) * 0.7), cy = H * (0.18 + hash(ht * 3) * 0.25), p = ease(age / 1.6);
    lighter(g, () => { for (let i = 0; i < 40; i++) { const [hx, hy] = heartXY((i / 40) * Math.PI * 2), s = 14 * p;
      const x = cx + hx * s, y = cy + hy * s + age * age * 40;
      add(g, G_WHITE, x, y, 10, (1 - p) * 0.9); add(g, i % 2 ? G_PINK : G_GOLD, x, y, 26, (1 - p) * 0.6); } });
  }
}

// 4. CHORUS ONE: an electric sunset, clouds, birds and bursts of light on the beat.
function sSunset(g, t, lt, e, b) {
  g.fillStyle = grad(g, 0, H, [[0, '#2a0a4a'], [0.35, '#8e1f6b'], [0.62, '#ff5e62'], [0.8, '#ff9966'], [1, '#ffc58a']]); g.fillRect(0, 0, W, H);
  const sy = H * 0.66 + lt * 2;
  lighter(g, () => { add(g, G_GOLD, W / 2, sy, 700 + e * 200, 0.7); add(g, G_PINK, W / 2, sy, 1100, 0.35); });
  g.fillStyle = '#fff1c9'; g.beginPath(); g.arc(W / 2, sy, 170, 0, 7); g.fill();
  lighter(g, () => { g.save(); g.translate(W / 2, sy); g.rotate(lt * 0.04);
    for (let i = 0; i < 16; i++) { g.rotate(Math.PI / 8); g.fillStyle = `rgba(255,220,170,${0.04 + e * 0.05})`; g.beginPath(); g.moveTo(0, 0); g.lineTo(1400, -60); g.lineTo(1400, 60); g.fill(); }
    g.restore(); });
  const r = rng(8);
  for (let i = 0; i < 9; i++) { const y = H * (0.18 + r() * 0.4), sp = 8 + r() * 20, x = wrap(r() * (W + 900) + lt * sp, W + 900) - 450, s = 0.6 + r();
    g.fillStyle = `rgba(255,${150 + r() * 60 | 0},${170 + r() * 40 | 0},0.22)`;
    for (let k = 0; k < 5; k++) { g.beginPath(); g.ellipse(x + k * 80 * s, y + Math.sin(k) * 14, 140 * s, 40 * s, 0, 0, 7); g.fill(); } }
  g.fillStyle = grad(g, H * 0.78, H, [[0, '#6e1d5c'], [1, '#1b0a2a']]); g.fillRect(0, H * 0.78, W, H * 0.22);
  lighter(g, () => { for (let i = 0; i < 26; i++) { const y = H * 0.79 + i * 9, w = (260 - i * 6) * (0.7 + 0.3 * Math.sin(lt * 3 + i)); g.fillStyle = `rgba(255,220,170,${0.5 - i * 0.017})`; g.fillRect(W / 2 - w / 2 + Math.sin(lt * 2 + i * 1.7) * 20, y, w, 3); } });
  g.strokeStyle = 'rgba(40,10,40,0.85)'; g.lineWidth = 3;
  for (let i = 0; i < 7; i++) { const x = wrap(-200 + lt * 70 + i * 90, W + 400) - 200, y = H * 0.3 + Math.sin(i * 2) * 60 + Math.sin(lt + i) * 10, f = Math.sin(lt * 8 + i) * 12;
    g.beginPath(); g.moveTo(x - 18, y - f); g.quadraticCurveTo(x - 8, y - 6, x, y); g.quadraticCurveTo(x + 8, y - 6, x + 18, y - f); g.stroke(); }
  burst(g, t, 51, 77);
  actSunset(g, t, lt);
}

// 5. MOONLIT SEA: a giant moon, its path on the water, shooting stars.
function sSea(g, t, lt, e, b) {
  g.fillStyle = grad(g, 0, H, [[0, '#02030c'], [0.5, '#0b1440'], [0.66, '#253070'], [1, '#05081c']]); g.fillRect(0, 0, W, H);
  const r = rng(2);
  lighter(g, () => { for (let i = 0; i < 260; i++) { const x = r() * W, y = r() * H * 0.62, s = r() * r() * 3 + 0.5; add(g, G_WHITE, x, y, s * 4, 0.4 + 0.6 * Math.abs(Math.sin(lt * (0.5 + r()) + i))); } });
  const mx = W * 0.5, my = H * 0.36 - lt * 1.5;
  lighter(g, () => { add(g, G_BLUE, mx, my, 700, 0.6); add(g, G_WHITE, mx, my, 330, 0.5); });
  g.fillStyle = '#f4f2ff'; g.beginPath(); g.arc(mx, my, 160, 0, 7); g.fill();
  g.fillStyle = 'rgba(180,180,220,0.25)'; [[-40, -30, 30], [50, 20, 22], [-20, 60, 16], [30, -70, 12]].forEach(([dx, dy, rr]) => { g.beginPath(); g.arc(mx + dx, my + dy, rr, 0, 7); g.fill(); });
  const hy = H * 0.66; g.fillStyle = grad(g, hy, H, [[0, '#101a4a'], [1, '#02030c']]); g.fillRect(0, hy, W, H - hy);
  lighter(g, () => { for (let i = 0; i < 46; i++) { const y = hy + 4 + i * i * 0.2, w = (60 + i * 9) * (0.6 + 0.4 * Math.sin(lt * 2.4 + i * 0.9));
    g.fillStyle = `rgba(210,220,255,${0.55 - i * 0.011})`; g.fillRect(mx - w / 2 + Math.sin(lt * 1.5 + i) * (10 + i), y, w, 2 + i * 0.06); } });
  g.strokeStyle = 'rgba(120,140,220,0.18)'; g.lineWidth = 2;
  for (let k = 0; k < 8; k++) { const y = hy + 20 + k * k * 6; g.beginPath(); for (let x = 0; x <= W; x += 20) g.lineTo(x, y + Math.sin(x * 0.01 + lt * (1 + k * 0.2) + k) * (2 + k)); g.stroke(); }
  for (let i = 0; i < 4; i++) { const st = 1.5 + i * 5.3, p = (lt - st) / 0.9; if (p < 0 || p > 1) continue;
    const x0 = W * (0.15 + hash(i) * 0.6), y0 = H * (0.05 + hash(i + 9) * 0.2), x = x0 + p * 500, y = y0 + p * 220;
    lighter(g, () => { const gr = g.createLinearGradient(x - 250, y - 110, x, y); gr.addColorStop(0, 'rgba(255,255,255,0)'); gr.addColorStop(1, `rgba(255,255,255,${1 - p})`);
      g.strokeStyle = gr; g.lineWidth = 3; g.beginPath(); g.moveTo(x - 250, y - 110); g.lineTo(x, y); g.stroke(); add(g, G_WHITE, x, y, 30, 1 - p); }); }
  actSea(g, t, lt);
}

// 6. SKY LANTERNS: warm lights rising into an indigo dusk.
const LANTERNS = (() => { const r = rng(77); return Array.from({ length: 60 }, () => ({ x: r() * W, z: 0.3 + r() * 0.9, sp: 30 + r() * 40, ph: r() * 9, off: r() * (H + 300) })); })();
function drawLanterns(g, lt, count, alphaMul = 1) {
  if (count <= 0 || alphaMul <= 0) return;
  const L = LANTERNS.slice(0, count).sort((a, b) => a.z - b.z);
  for (const l of L) {
    const y = H + 150 - wrap(l.off + lt * l.sp * l.z, H + 300), x = l.x + Math.sin(lt * 0.4 + l.ph) * 30 * l.z, s = 34 * l.z;
    const fl = 0.8 + 0.2 * Math.sin(lt * 9 + l.ph * 7);
    lighter(g, () => add(g, G_AMBER, x, y, s * 4.5, 0.45 * fl * alphaMul));
    g.globalAlpha = alphaMul;
    const gr = g.createLinearGradient(0, y - s, 0, y + s); gr.addColorStop(0, '#ffcf7a'); gr.addColorStop(1, '#ff7a2a');
    g.fillStyle = gr; g.beginPath(); g.moveTo(x - s * 0.7, y - s); g.lineTo(x + s * 0.7, y - s); g.lineTo(x + s * 0.5, y + s); g.lineTo(x - s * 0.5, y + s); g.closePath(); g.fill();
    g.fillStyle = `rgba(255,255,220,${0.8 * fl})`; g.fillRect(x - s * 0.25, y + s * 0.6, s * 0.5, s * 0.3);
    g.globalAlpha = 1;
  }
}
function sLanterns(g, t, lt, e, b) {
  g.fillStyle = grad(g, 0, H, [[0, '#0a0828'], [0.55, '#3a1a5a'], [0.85, '#a4466a'], [1, '#e9845e']]); g.fillRect(0, 0, W, H);
  lighter(g, () => { const r = rng(4); for (let i = 0; i < 120; i++) add(g, G_WHITE, r() * W, r() * H * 0.5, 4, 0.5 * Math.abs(Math.sin(lt + i))); });
  g.globalAlpha = 0.9; g.drawImage(CITY_FAR, 0, H - 380); g.globalAlpha = 1;
  drawLanterns(g, lt + 20, 60);

const SIT_GROUND = pose({ l1: 1.45, l2: -0.1, m1: 1.1, m2: -1.0, a1: 0.5, a2: 0.2, b1: -0.6, b2: 0 });

}

  const PG = { ...swing(1), lean: 0.3, nod: 0.3, a1: 0.9, a2: 0.4, b1: 0.4, b2: 0.6 };
  stick(g, gx, py, s, 1, PG, { hip: true, girl: true, color: '#03040c', t });
  stick(g, bx, py, s, 1, PB, { hip: true, color: '#03040c', t });
}
// together they let a lantern go
function actLanterns(g, t, lt) {
  const ground = (x) => H - 60 - Math.sin(x * 0.004) * 30 - Math.sin(x * 0.013) * 12;
  const s = 1.5, cx = W * 0.74, bx = cx - 40 * s, gx = cx + 40 * s;
  const up = smooth(1.2, 2.2, lt) - smooth(4.2, 5.2, lt), hug = smooth(6, 7, lt);
  const RAISE = pose({ a1: 2.5, a2: 0.15, b1: 2.3, b2: 0.2 }), base = mixP(STAND, HUG, hug);
  const PB = mixP(base, RAISE, up), PG = mixP(base, RAISE, up);
  const b = stick(g, lerp(bx, cx - 46, hug), ground(bx) + 4, s, 1, PB, { color: '#0a0612', t });
  stick(g, lerp(gx, cx + 46, hug), ground(gx) + 4, s, -1, PG, { color: '#0a0612', girl: true, t });
  // their lantern: held between them, then free
  const free = Math.max(0, lt - 3.6), lx = cx + Math.sin(free * 0.8) * 20 * Math.min(1, free), ly = (b.handA[1] - 30) - free * free * 6 - free * 40;
  if (lt > 0.8) { const sz = 40, fl = 0.85 + 0.15 * Math.sin(lt * 11);
    g.globalAlpha = smooth(0.8, 1.4, lt);
    lighter(g, () => add(g, G_AMBER, lx, ly, sz * 5, 0.6 * fl));
    g.fillStyle = grad(g, ly - sz, ly + sz, [[0, '#ffe0a0'], [1, '#ff8a30']]); g.beginPath(); g.moveTo(lx - sz * 0.7, ly - sz); g.lineTo(lx + sz * 0.7, ly - sz); g.lineTo(lx + sz * 0.5, ly + sz); g.lineTo(lx - sz * 0.5, ly + sz); g.closePath(); g.fill();
    g.globalAlpha = 1; }
  heartPop(g, cx, ground(cx) - 300, lt - 7.2, 30);
}
// neon dancers on the grid, moving on the beat
function actRetro(g, t, lt) {
  const beat = t / (60 / 72), ph = beat * Math.PI, bounce = Math.abs(Math.sin(ph));
  const s = 1.55, gy = H - 30, sec = Math.floor(lt / 6.6) % 4;
  let PB, PG, fB = 1, fG = -1, bx = W / 2 - 110, gx = W / 2 + 110;
  if (sec === 0) { PB = pose({ a1: 1.2 + Math.sin(ph) * 1.0, a2: 0.6, b1: 1.2 - Math.sin(ph) * 1.0, b2: 0.6, l1: 0.2, l2: -bounce * 0.5, m1: -0.2, m2: -bounce * 0.4 }); PG = { ...PB }; }
  else if (sec === 1) { const sw = Math.sin(ph * 0.5) * 30; bx += sw; gx += sw; PB = pose({ a1: 0.8, a2: 0.2, lean: Math.sin(ph * 0.5) * 0.1, l2: -bounce * 0.3 }); PG = { ...PB }; }
  else if (sec === 2) { PB = pose({ a1: 2.6, a2: 0.2, b1: 0.4, l2: -bounce * 0.3 }); PG = pose({ a1: 2.6, a2: 0.2, b1: 0.2 }); fG = Math.floor(beat) % 2 ? 1 : -1; gx = W / 2 + 60; }
  else { fB = -1; fG = 1; PB = pose({ a1: 2.0 + Math.sin(ph) * 0.6, b1: 1.0, l1: 0.3 * Math.sin(ph), m1: -0.3 * Math.sin(ph), l2: -bounce * 0.5 }); PG = { ...PB, a1: 2.0 - Math.sin(ph) * 0.6 }; bx = W / 2 - 60; gx = W / 2 + 60; }
  stick(g, bx, gy, s, fB, PB, { outline: true, color: '#00e5ff', glow: '#00e5ff', t });
  stick(g, gx, gy, s, fG, PG, { outline: true, color: '#ff3fd0', glow: '#ff3fd0', girl: true, t });
}
// in the rain, a memory of her appears beside him and fades into light
function actRain(g, t, lt, px, py) {
  for (const [a, b] of [[1.5, 9.5], [14.5, 23]]) {
    const life = lt - a, span = b - a; if (life < 0 || life > span + 1.5) continue;
    const al = smooth(0, 1.2, life) * (1 - smooth(span - 1.5, span, life));
    const reach = smooth(1, 3, life) - smooth(span - 2.5, span - 1.5, life);
    if (al > 0) stick(g, px + 140, py, 1.75, -1, pose({ a1: lerp(0.1, 1.1, reach), a2: 0.15, nod: 0.1 }), { girl: true, outline: true, color: 'rgba(170,200,255,0.9)', glow: '#9fc0ff', alpha: al * 0.75, t });
    const dp = (life - (span - 1.5)) / 1.5;
    if (dp > 0 && dp < 1) lighter(g, () => { for (let i = 0; i < 40; i++) add(g, G_BLUE, px + 120 + hash(i) * 60, py - hash(i * 3) * 300 - dp * 160 * hash(i * 7), 10, (1 - dp) * 0.9); });
  }
}
// they run to each other through the field, hug, sit, then watch the fireworks
function actGolden(g, t, lt) {
  const cx = W * 0.62, gy = H - 92, s = 2.0, col = '#2a0e1c';
  let bx, gx, PB, PG, fB = 1, fG = -1, hip = false;
  if (lt < 6) { const p = ease(lt / 6); bx = lerp(cx - 900, cx - 62, p); gx = lerp(cx + 900, cx + 62, p); PB = mixP(walkP(lt * 10, true), STAND, smooth(5.3, 6, lt)); PG = mixP(walkP(lt * 10 + 1.5, true), STAND, smooth(5.3, 6, lt)); }
  else if (lt < 20) { bx = cx - 62; gx = cx + 62; PB = mixP(STAND, HUG, smooth(5.8, 6.6, lt)); PG = { ...PB }; const sw = Math.sin(lt * 1.2) * 0.06; PB.lean += sw; PG.lean += sw; }
  else if (lt < 34) { const k = smooth(20, 21.5, lt); hip = k > 0.5; fG = 1; bx = cx + 30; gx = cx - 50;
    PB = hip ? SIT_GROUND : STAND; PG = hip ? { ...SIT_GROUND, lean: 0.32, nod: 0.25 } : STAND; }
  else { bx = cx - 70; gx = cx + 10; fG = 1; const pt = 0.5 + 0.5 * Math.sin(lt * 0.8);
    PB = pose({ a1: 1.2, a2: 0.4, nod: -0.2 }); PG = pose({ a1: lerp(1.6, 2.6, pt), a2: 0.1, nod: -0.25, b1: 0.3 }); }
  const yy = hip ? gy - 8 : gy;
  // the fade between standing and sitting
  const fadeSit = 1 - (smooth(19.6, 20.4, lt) - smooth(20.6, 21.4, lt)) * 0.9 - (smooth(33.4, 34, lt) - smooth(34, 34.6, lt)) * 0.9;
  stick(g, bx, yy, s, fB, PB, { color: col, hip, alpha: fadeSit, t });
  stick(g, gx, yy, s, fG, PG, { color: col, girl: true, hip, alpha: fadeSit, t });
  sparkleAt(g, cx, gy - 250, lt - 6);
  heartPop(g, cx, gy - 330, lt - 6.3, 50); heartPop(g, cx - 40, gy - 380, lt - 7, 30, '#ffb3cf'); heartPop(g, cx + 40, gy - 260, lt - 26, 32);
}
// she waves from the train window, he waves back from the bridge
function actLeaving(g, t, lt) {
  const p = ease(lt / 16), y = H - 260, scale = 1 - p * 0.35, x0 = lerp(-400, W + 1700, p);
  const wx = x0 - 2 * 300 * scale + (16 + 4 * 29) * scale, wy = y + 14 * scale;
  g.save(); g.beginPath(); g.rect(wx, wy, 18 * scale, 22 * scale); g.clip(); g.fillStyle = '#2a1020';
  g.beginPath(); g.arc(wx + 9 * scale, wy + 10 * scale, 6 * scale, 0, 7); g.fill(); g.fillRect(wx + 3 * scale, wy + 15 * scale, 12 * scale, 10 * scale); g.restore();
  const wave = 2.5 + Math.sin(lt * 7) * 0.35;
  stick(g, W * 0.12, H - 194, 1.05, 1, pose({ a1: wave, a2: 0.2, nod: -0.15 }), { color: '#07030d', t });
}

// ---------- the running order ----------
// trans: how this scene comes in. lyric: how lyrics look in this scene.
const SCENES = [
  { from: 0,     draw: sTitle,    lyric: 'cinema' },
  { from: 13.5,  draw: sWindow,   lyric: 'cinema', trans: 'flash' },
  { from: 37.6,  draw: sPlatform, lyric: 'cinema', trans: 'zoom' },
  { from: 50.6,  draw: sSunset,   lyric: 'pop',    trans: 'heart', zoomBeat: true },
  { from: 77,    draw: sSea,      lyric: 'cinema', trans: 'wipe' },
  { from: 99,    draw: sLanterns, lyric: 'cinema', trans: 'heart' },
  { from: 109.9, draw: sRetro,    lyric: 'neon',   trans: 'glitch', zoomBeat: true },
  { from: 136.6, draw: sRain,     lyric: 'spaced', trans: 'zoom' },
  { from: 162.2, draw: sGolden,   lyric: 'pop',    trans: 'flash', zoomBeat: true },
  { from: 215.2, draw: sLeaving,  lyric: 'cinema', trans: 'burn', lyricY: H * 0.42 },
];
const TR = 1.4;
const DUR = 233.6;

// ---------- lyrics ----------
const HOT = new Set(['choo', 'lo', 'dil', 'intezaar', 'nazron', 'beqaraar', 'pyaas', 'yunhi', 'aas', 'bebasi']);
const clean = (w) => w.toLowerCase().replace(/[^a-z]/g, '');
const STYLES = {
  cinema: { font: (h) => h ? 'italic 112px Serif' : 'italic 96px Serif', y: H * 0.78 },
  pop:    { font: (h) => h ? '700 150px Script' : '800 92px Pop', y: H * 0.3 },
  neon:   { font: (h) => h ? '112px Neon' : '800 88px Pop', y: H * 0.3 },
  spaced: { font: () => '300 62px Pop', y: H * 0.4 },
};
function drawLyrics(g, t, style, yOver) {
  const S = { ...STYLES[style], y: yOver ?? STYLES[style].y };
  for (const L of LYRICS) {
    const life = t - L.start; if (life < -0.1 || t > L.end + 0.5) continue;
    const outP = smooth(L.end, L.end + 0.5, t), words = L.text.split(/\s+/);
    const per = Math.min(0.42, ((L.end - L.start) * 0.55) / words.length);
    g.save(); g.textBaseline = 'middle';
    if (style === 'spaced') g.letterSpacing = '16px';
    const parts = words.map((w) => { const hot = HOT.has(clean(w)), font = S.font(hot), text = style === 'spaced' ? w.toUpperCase() : w; g.font = font; return { w: text, hot, font, width: g.measureText(text).width }; });
    const sp = 30, total = parts.reduce((a, p) => a + p.width, 0) + sp * (parts.length - 1), k = Math.min(1, W * 0.86 / total);
    g.translate(W / 2, S.y - outP * 40); g.scale(k, k);
    let x = -total / 2;
    parts.forEach((p, i) => {
      const lp = (life - i * per) / 0.55, a = clamp(lp) * (1 - outP);
      if (a > 0) {
        g.font = p.font; g.globalAlpha = a; g.textAlign = 'center';
        g.save(); g.translate(x + p.width / 2, 0);
        if (style === 'pop') { const s = lerp(1.6, 1, easeBack(lp)); g.scale(s, s); g.rotate((1 - clamp(lp)) * (i % 2 ? 0.12 : -0.12)); }
        else if (style === 'neon') g.translate(0, (1 - ease(lp)) * -60);
        else { g.translate(0, (1 - ease(lp)) * 30); if (lp < 1) g.filter = `blur(${(1 - clamp(lp)) * 12}px)`; }
        if (style === 'neon') {
          const off = 3 + (1 - clamp(lp)) * 18;
          g.globalCompositeOperation = 'lighter';
          g.fillStyle = 'rgba(0,240,255,0.7)'; g.fillText(p.w, -off, 0);
          g.fillStyle = 'rgba(255,40,180,0.7)'; g.fillText(p.w, off, 0);
          g.globalCompositeOperation = 'source-over';
          g.shadowColor = p.hot ? '#ff3fd0' : '#00e5ff'; g.shadowBlur = 30; g.fillStyle = '#fff'; g.fillText(p.w, 0, 0);
        } else {
          g.shadowColor = style === 'pop' ? 'rgba(90,0,50,0.6)' : 'rgba(255,110,170,0.9)';
          g.shadowBlur = style === 'pop' ? 26 : 30; if (style === 'pop') g.shadowOffsetY = 6;
          if (style === 'pop') { g.lineJoin = 'round'; g.lineWidth = 10; g.strokeStyle = 'rgba(70,0,40,0.55)'; g.strokeText(p.w, 0, 0); }
          g.fillStyle = p.hot ? grad(g, -70, 70, style === 'pop' ? [[0, '#ffffff'], [1, '#ffd1e3']] : [[0, '#fff6d6'], [0.5, '#ffb6cf'], [1, '#ff5f9e']]) : '#fffafc';
          g.fillText(p.w, 0, 0);
          g.shadowBlur = 0; g.shadowOffsetY = 0; g.fillText(p.w, 0, 0);
        }
        g.restore();
      }
      x += p.width + sp;
    });
    g.restore();
  }
}

// ---------- transitions ----------
const A = buffer(), B = buffer(), ga = A.getContext('2d'), gb = B.getContext('2d');
function renderScene(i, g, t) {
  const s = SCENES[i], e = energy(t), b = bass(t);
  g.save(); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.filter = 'none'; g.shadowBlur = 0;
  if (s.zoomBeat) { const z = 1 + b * 0.025; g.translate(W / 2, H / 2); g.scale(z, z); g.translate(-W / 2, -H / 2); }
  s.draw(g, t, t - s.from, e, b);
  g.restore();
}
function composite(g, p, kind) {
  // A holds the outgoing scene, B the incoming one. p goes 0 -> 1.
  g.save();
  if (kind === 'zoom') {
    const za = 1 + ease(p) * 0.5, zb = 1.25 - ease(p) * 0.25;
    g.translate(W / 2, H / 2); g.scale(za, za); g.translate(-W / 2, -H / 2); g.drawImage(A, 0, 0);
    g.setTransform(1, 0, 0, 1, 0, 0); g.translate(W / 2, H / 2); g.scale(zb, zb); g.translate(-W / 2, -H / 2);
    g.globalAlpha = smooth(0.15, 0.85, p); g.drawImage(B, 0, 0);
  } else if (kind === 'wipe') {
    g.drawImage(A, 0, 0);
    const x = lerp(-400, W + 400, ease(p));
    g.save(); g.beginPath(); g.moveTo(x - 300, 0); g.lineTo(x + 300, H); g.lineTo(-800, H); g.lineTo(-800, 0); g.clip(); g.drawImage(B, 0, 0); g.restore();
    g.globalCompositeOperation = 'lighter'; g.strokeStyle = 'rgba(255,220,200,0.9)'; g.lineWidth = 6; g.shadowColor = '#ff9ac0'; g.shadowBlur = 40;
    g.beginPath(); g.moveTo(x - 300, 0); g.lineTo(x + 300, H); g.stroke();
  } else if (kind === 'heart') {
    g.drawImage(A, 0, 0);
    const sc = Math.pow(ease(p), 1.6) * 90;
    g.save(); g.translate(W / 2, H / 2 + 40); g.beginPath();
    for (let i = 0; i <= 80; i++) { const [hx, hy] = heartXY((i / 80) * Math.PI * 2); i ? g.lineTo(hx * sc, hy * sc) : g.moveTo(hx * sc, hy * sc); }
    g.closePath(); g.save(); g.clip(); g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(B, 0, 0); g.restore();
    g.lineWidth = 6 / Math.max(sc, 0.01) * sc; g.strokeStyle = 'rgba(255,200,220,0.95)'; g.shadowColor = '#ff5f9e'; g.shadowBlur = 40; g.stroke(); g.restore();
  } else if (kind === 'glitch') {
    g.drawImage(p < 0.5 ? A : B, 0, 0);
    const amt = Math.sin(p * Math.PI), fr = Math.floor(p * 12);
    for (let i = 0; i < 14; i++) { const y = hash(i + fr * 31) * H, hh = 10 + hash(i * 3 + fr) * 80, dx = (hash(i * 7 + fr) - 0.5) * 300 * amt;
      g.drawImage(hash(i + fr) < 0.5 ? A : B, 0, y, W, hh, dx, y, W, hh); }
    g.globalCompositeOperation = 'lighter'; g.globalAlpha = 0.35 * amt; g.drawImage(B, 14 * amt, 0);
    g.globalAlpha = 0.25 * amt; g.fillStyle = '#ff2bd6'; g.fillRect(0, 0, W, H);
  } else {
    g.drawImage(A, 0, 0); g.globalAlpha = smooth(0.3, 0.7, p); g.drawImage(B, 0, 0);
    g.globalAlpha = 1; g.globalCompositeOperation = 'lighter';
    const f = Math.sin(p * Math.PI);
    if (kind === 'burn') {
      g.globalAlpha = f * 0.9;
      const gr = g.createRadialGradient(W * 0.85, H * 0.5, 0, W * 0.85, H * 0.5, W * 0.9);
      gr.addColorStop(0, 'rgba(255,200,120,1)'); gr.addColorStop(0.4, 'rgba(255,90,40,0.7)'); gr.addColorStop(1, 'rgba(120,0,40,0)');
      g.fillStyle = gr; g.fillRect(0, 0, W, H);
    } else {
      g.globalAlpha = f; g.drawImage(G_WHITE, -W * 0.5, -H * 0.5, W * 2, H * 2);
      g.globalAlpha = f * 0.7; g.drawImage(G_PINK, -W * 0.2, -H * 0.6, W * 1.4, H * 2.2);
    }
  }
  g.restore();
}

// ---------- overlays ----------
function leaks(g, t, e) {
  lighter(g, () => {
    add(g, G_PINK, W * (0.1 + 0.15 * Math.sin(t * 0.13)), H * (0.1 + 0.1 * Math.cos(t * 0.17)), 900, 0.10 + e * 0.12);
    add(g, G_GOLD, W * (0.9 - 0.12 * Math.sin(t * 0.11)), H * (0.95 - 0.1 * Math.sin(t * 0.19)), 800, 0.08 + e * 0.10);
  });
}
function finish(g, t) {
  g.save();
  const v = g.createRadialGradient(W / 2, H / 2, H * 0.35, W / 2, H / 2, H * 1.05);
  v.addColorStop(0, 'rgba(0,0,0,0)'); v.addColorStop(1, 'rgba(4,0,10,0.62)'); g.fillStyle = v; g.fillRect(0, 0, W, H);
  const k = Math.floor(t * 24), gx = Math.floor(hash(k) * 512), gy = Math.floor(hash(k + 99) * 512);
  g.fillStyle = g.createPattern(GRAIN, 'repeat'); g.translate(-gx, -gy); g.fillRect(gx, gy, W, H); g.setTransform(1, 0, 0, 1, 0, 0);
  const bar = 90 * Math.max(1 - smooth(11, 14, t), smooth(215, 217, t));
  if (bar > 0) { g.fillStyle = '#000'; g.fillRect(0, 0, W, bar); g.fillRect(0, H - bar, W, bar); }
  const fade = Math.min(smooth(0, 1.2, t), 1 - smooth(DUR - 2.2, DUR, t));
  if (fade < 1) { g.fillStyle = `rgba(0,0,0,${1 - fade})`; g.fillRect(0, 0, W, H); }
  g.restore();
}

// ---------- the frame ----------
window.drawFrame = function (t) {
  let i = 0; while (i < SCENES.length - 1 && t >= SCENES[i + 1].from) i++;
  const next = SCENES[i + 1], into = t - SCENES[i].from, e = energy(t);
  main.save();
  if (i > 0 && into < TR / 2) { renderScene(i - 1, ga, t); renderScene(i, gb, t); composite(main, 0.5 + into / TR, SCENES[i].trans); }
  else if (next && next.from - t < TR / 2) { renderScene(i, ga, t); renderScene(i + 1, gb, t); composite(main, 0.5 - (next.from - t) / TR, next.trans); }
  else renderScene(i, main, t);
  main.restore();
  leaks(main, t, e);
  if (SCENES[i].zoomBeat) { const h = hit(t); if (h > 0) lighter(main, () => { main.globalAlpha = h * 0.16; main.fillStyle = '#ffe6f0'; main.fillRect(0, 0, W, H); }); }
  drawLyrics(main, t, SCENES[i].lyric, SCENES[i].lyricY);
  finish(main, t);
};

// ---------- loading ----------
function parseLRC(src) {
  const out = [];
  for (const line of src.split(/\r?\n/)) { const m = line.match(/^\[(\d+):(\d+(?:\.\d+)?)\](.*)$/); if (m) out.push({ start: +m[1] * 60 + +m[2], text: m[3].trim() }); }
  out.sort((a, b) => a.start - b.start);
  out.forEach((l, i) => { l.end = Math.min((out[i + 1]?.start ?? l.start + 6) - 0.5, l.start + 7); });
  return out.filter((l) => l.text);
}
window.ready = (async () => {
  AUDIO = await (await fetch('audio.json')).json();
  try { const r = await fetch('lyrics.lrc'); if (r.ok) LYRICS = parseLRC(await r.text()); } catch {}
  for (let f = 1; f < AUDIO.bass.length - 1; f++) { const t = f / AUDIO.fps, h = hit(t);
    if (h > 0.5 && h >= hit(t - 1 / 30) && h > hit(t + 1 / 30) && (!HITS.length || t - HITS[HITS.length - 1] > 0.9)) HITS.push(t); }
  await Promise.all(['italic 96px Serif', '800 92px Pop', '300 34px Pop', '700 150px Script', '112px Neon', '30px Inter'].map((f) => document.fonts.load(f, 'Choo Lo abc')));
  return LYRICS.length;
})();

if (!navigator.webdriver) {
  window.ready.then(() => {
    const t0 = +(new URLSearchParams(location.search).get('t') || 0), s = performance.now();
    const loop = () => { drawFrame(t0 + (performance.now() - s) / 1000); requestAnimationFrame(loop); }; loop();
  });
}
</script>
